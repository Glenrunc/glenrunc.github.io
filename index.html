<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Portfolio of Mattéo Pourcine — AI Systems Engineer, computer vision and deep learning.">
    <meta name="author" content="Mattéo Pourcine">
    <title>Mattéo Pourcine | AI Systems Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Fixed header -->
    <header class="header">
        <div class="header-left">
            <span class="header-name">Mattéo Pourcine</span>
            <span class="header-sep">//</span>
            <span class="header-role" id="header-role">AI Systems Engineer</span>
        </div>
        <div class="header-right">
            <span class="header-hint" id="header-hint">click nodes to explore</span>
            <button id="lang-toggle" class="control-btn" aria-label="Toggle language">
                <span class="lang-text">EN</span>
            </button>
        </div>
    </header>

<!-- Globe viewport -->
    <div id="graph-container">
        <canvas id="globe-canvas"></canvas>
        <div id="node-overlay"></div>
    </div>

    <!-- Detail panel (slides in from right) -->
    <aside id="detail-panel">
        <div class="panel-header">
            <span class="panel-path" id="panel-path">~/portfolio</span>
            <button class="panel-close" id="panel-close">[×]</button>
        </div>
        <div class="panel-body" id="panel-body"></div>
    </aside>

    <!-- Zoom controls -->
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
        <button class="zoom-btn zoom-reset" id="zoom-reset" title="Reset view">⌂</button>
    </div>

    <!-- Visitor counter -->
    <div class="visitor-badge">
        <span id="visitor-label">visitors</span>
        <span id="visitor-count">—</span>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">[×]</span>
            <div class="video-wrapper">
                <iframe id="video-iframe" src="" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Terminal bar -->
    <div id="term-output-box"></div>
    <div id="term-bar">
        <span class="term-ps1">matteo@portfolio:~$</span>
        <span id="term-display"></span><span class="term-cursor">_</span>
        <input id="term-input" type="text" autocomplete="off" spellcheck="false" aria-label="terminal">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="./script.js"></script>
</body>
</html>
